[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "robotchat"
version = "0.1.0"
description = "RobotChat 全双工语音交互系统"
readme = "README.md"
requires-python = ">=3.10,<3.13"
# 依赖白名单见 design §1.1：应用镜像禁止 torch / transformers / funasr / vllm 等重型推理框架
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "websockets>=12",
    "onnxruntime>=1.17",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
robotchat = "robotchat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotchat"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["robotchat"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src/robotchat"]

[[tool.mypy.overrides]]
module = ["yaml", "rclpy", "rclpy.*", "onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
